services:
  rabbitmq:
    image: docker.io/rabbitmq:4-management-alpine
    container_name: fila-rabbitmq
    hostname: fila-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
